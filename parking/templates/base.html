<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parking App{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #dfc519 0%, #2a5298 100%);
            color: #2c3e50; /* Darker text for visibility */
            line-height: 1.6;
            overflow-x: hidden;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7, 239, 134, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 1.5rem 0;
        }
        nav ul li a {
            color: #0861ea;
            text-decoration: none;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #00ddeb;
            transform: scaleX(0);
            transition: transform 0.3s ease-out;
        }
        nav ul li a:hover::after { transform: scaleX(1); }
        nav ul li a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #00ddeb;
        }
        main { padding: 3rem 1rem; min-height: 80vh; }
        .message {
            padding: 1rem;
            margin: 1rem auto;
            max-width: 600px;
            border-radius: 8px;
            text-align: center;
            color: #fff;
        }
        .message.success { background: #34c759; }
        .message.error { background: #ff4d4d; }
        @media (max-width: 768px) {
            nav ul { flex-direction: column; align-items: center; padding: 1rem 0; }
            nav ul li a { width: 80%; text-align: center; margin: 0.5rem 0; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{% url 'parking:parking_list' %}">Home</a></li>
                {% if user.is_authenticated %}
                    <li><a href="{% url 'parking:profile' %}">Profile</a></li>
                    <li><a href="{% url 'parking:my_bookings' %}">My Bookings</a></li>
                    <li><a href="{% url 'parking:booking_history' %}">History</a></li>
                    <li><a href="{% url 'logout' %}">Logout</a></li>
                {% else %}
                    <li><a href="{% url 'login' %}">Login</a></li>
                    <li><a href="{% url 'parking:signup' %}">Sign Up</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
