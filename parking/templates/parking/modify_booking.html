{% extends 'base.html' %}
{% block title %}Modify Booking{% endblock %}
{% block content %}
    <div class="container">
        <h1>Modify Booking</h1>
        <form method="post" class="modify-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Update Booking</button>
        </form>
    </div>
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            color: #3498db;
        }
        .modify-form p {
            margin: 1.5rem 0;
        }
        .modify-form input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: #3498db;
            color: #fff;
            width: 100%;
            margin-top: 1rem;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
    </style>
{% endblock %}
