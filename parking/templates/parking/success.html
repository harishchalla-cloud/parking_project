{% extends 'base.html' %}
{% block title %}Account Created - Parking App{% endblock %}
{% block content %}
    <div class="container">
        <h1 class="text-success">Account Created Successfully!</h1>
        <div class="card">
            <div class="card-body text-center">
                <p>Welcome, <strong>{{ user.username }}</strong>! Your account has been created.</p>
                <div class="d-flex justify-content-center gap-3 mb-3">
                    <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
                    <a href="{% url 'parking:parking_list' %}" class="btn btn-primary">View Parking Spots</a>
                </div>
                <p><a href="{% url 'parking:signup' %}" class="btn btn-secondary">Create another account</a></p>
            </div>
        </div>
    </div>
{% endblock %}
