{% extends 'base.html' %}
{% block title %}Account Created - Parking App{% endblock %}
{% block content %}
    <div class="container">
        <h1>Account Created Successfully!</h1>
        <p>Welcome, <strong>{{ user.username }}</strong>! Your account has been created.</p>
        <p>
            <a href="{% url 'login' %}" class="button">Login</a>
            <a href="{% url 'parking:parking_list' %}" class="button">View Parking Spots</a>
        </p>
        <p><a href="{% url 'parking:signup' %}" class="button">Create another account</a></p>
    </div>

    <style>
        .container {
            max-width: 600px;
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 1.1em;
            text-align: center;
            color: #555;
            margin: 10px 0;
        }
        .button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1.1em;
            margin: 10px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .link {
            color: #007bff;
            text-decoration: none;
            font-size: 1em;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
{% endblock %}
