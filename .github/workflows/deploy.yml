name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate deployment package
        run: |
          ls -la  # Debug: List files to verify structure
          zip -r deploy.zip . -x "*.git*" "*.github*" "venv/*" ".env"
          ls -la deploy.zip  # Debug: Verify zip file

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Create Elastic Beanstalk application
        run: |
          aws elasticbeanstalk create-application \
            --application-name parking-app \
            --description "Parking App on Elastic Beanstalk" \
            --region us-east-1 || echo "Application already exists"

      - name: Create Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk create-environment \
            --application-name parking-app \
            --environment-name Parking-app-env-new \
            --solution-stack-name "64bit Amazon Linux 2023 v4.0.6 running Python 3.9" \
            --option-settings \
              Namespace=aws:autoscaling:launchconfiguration,OptionName=InstanceType,Value=t3.micro \
              Namespace=aws:elasticbeanstalk:environment:process:default,OptionName=HealthCheckPath,Value=/parking/ \
              Namespace=aws:elasticbeanstalk:environment:process:default,OptionName=MatcherHTTPCode,Value=200 \
              Namespace=aws:elasticbeanstalk:environment:process:default,OptionName=Port,Value=8000 \
              Namespace=aws:elasticbeanstalk:environment:process:default,OptionName=Protocol,Value=HTTP \
            --region us-east-1 || echo "Environment already exists or creation in progress"

      - name: Wait for environment to be ready
        run: |
          aws elasticbeanstalk wait environment-exists \
            --application-name parking-app \
            --environment-name Parking-app-env-new \
            --region us-east-1
          aws elasticbeanstalk wait environment-updated \
            --application-name parking-app \
            --environment-name Parking-app-env-new \
            --region us-east-1

      - name: Set environment variables
        run: |
          aws elasticbeanstalk update-environment \
            --application-name parking-app \
            --environment-name Parking-app-env-new \
            --option-settings \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=DB_PASSWORD,Value=${{ secrets.DB_PASSWORD }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SECRET_KEY,Value=${{ secrets.SECRET_KEY }} \
            --region us-east-1

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: parking-app
          environment_name: Parking-app-env-new
          version_label: ${{ github.sha }}
          region: us-east-1
          deployment_package: deploy.zip